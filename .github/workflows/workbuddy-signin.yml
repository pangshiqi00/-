name: WorkBuddy 每日签到

on:
  schedule:
    # 每天 16:00 UTC 触发 = 北京时间 00:00，之后随机延时 0~4 小时再签到
    - cron: '0 16 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成凭证文件
        env:
          WORKBUDDY_AUTH_17611553500: ${{ secrets.WORKBUDDY_AUTH_17611553500 }}
          WORKBUDDY_AUTH_13522056750: ${{ secrets.WORKBUDDY_AUTH_13522056750 }}
        run: |
          mkdir -p auths
          # 只写入非空的凭证，避免空 Secret 生成无效文件
          n=0
          for v in "$WORKBUDDY_AUTH_17611553500" "$WORKBUDDY_AUTH_13522056750"; do
            if [ -n "$v" ]; then
              n=$((n+1))
              printf '%s' "$v" > "auths/workbuddy-$n.json"
            fi
          done
          if [ "$n" -eq 0 ]; then
            echo "❌ 未配置任何 WORKBUDDY_AUTH_N secret"
            exit 1
          fi
          echo "已生成 $n 个账号凭证"

      - name: 随机延时（模拟真人，0~4 小时）
        if: github.event_name == 'schedule'
        run: |
          S=$(( (RANDOM % 14400) + 60 ))
          echo "北京时间 00:00 触发，随机等待 $S 秒（约 $((S/60)) 分钟）后签到"
          sleep $S

      - name: 执行签到
        run: python checkin.py

      - name: Bark 通知
        if: always()
        run: |
          TITLE="WorkBuddy签到"
          BODY="查看 Actions 运行日志获取结果"
          TITLE_ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$TITLE'))")
          BODY_ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$BODY'))")
          curl -s -X POST "${{ secrets.BARK_URL }}/${TITLE_ENC}/${BODY_ENC}" || true

      - name: 清理凭证
        if: always()
        run: rm -rf auths
