name: WorkBuddy 每日签到

on:
  schedule:
    # 全天每 30 分钟触发一次。真正执行哪一次由 checkin_gate.py 按日期抽签决定：
    # 抽中的目标时刻之后、当天 23:00 之前的任何一次运行都会执行签到。
    # 不能只在窄窗口内触发：GitHub 的 schedule 会延迟甚至丢弃（实测某天 22 次只交付 1 次），
    # 窗口外的运行被门控跳过，就会整天漏签。仓库 public 后标准 runner 不计费，触发次数不是成本。
    - cron: '0,30 * * * *'
  workflow_dispatch: # 手动触发（不抽签，直接签到）

concurrency:
  group: workbuddy-cn
  cancel-in-progress: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 北京时间 00:00~06:00 抽一个目标时刻，到点后真签；当天最多 3 次，没到点就几秒退出（不装 Python）
      # 当天已执行次数存在 Actions 缓存里（按天、按工作流分别计数），用于限次
      - name: 取当天日期
        id: day
        run: echo "today=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: 读取当天已执行次数
        uses: actions/cache@v4
        with:
          path: .wb_state
          key: wb-cn-${{ steps.day.outputs.today }}-${{ github.run_id }}
          restore-keys: |
            wb-cn-${{ steps.day.outputs.today }}-

      - name: 抽签（今天这次要不要签）
        id: gate
        run: >-
          python3 checkin_gate.py
          --tz Asia/Shanghai --start 0 --end 6 --seed wb-cn- --max-runs 3 --state .wb_state/count

      - name: 安装 Python
        if: steps.gate.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成凭证文件
        if: steps.gate.outputs.run == '1'
        env:
          WORKBUDDY_AUTH_1: ${{ secrets.WORKBUDDY_AUTH_1 }}
          WORKBUDDY_AUTH_2: ${{ secrets.WORKBUDDY_AUTH_2 }}
        run: |
          mkdir -p auths
          # 只写入非空的凭证，避免空 Secret 生成无效文件
          n=0
          for v in "$WORKBUDDY_AUTH_1" "$WORKBUDDY_AUTH_2"; do
            if [ -n "$v" ]; then
              n=$((n+1))
              printf '%s' "$v" > "auths/workbuddy-$n.json"
            fi
          done
          if [ "$n" -eq 0 ]; then
            echo "❌ 未配置 WORKBUDDY_AUTH_1 / WORKBUDDY_AUTH_2"
            exit 1
          fi
          echo "已生成 $n 个账号凭证"

      - name: 执行签到
        if: steps.gate.outputs.run == '1'
        id: checkin
        run: |
          set +e
          OUTPUT=$(python checkin.py 2>&1)
          CODE=$?
          set -e
          printf '%s\n' "$OUTPUT"
          {
            echo "code=$CODE"
            echo "output<<WB_EOF"
            printf '%s\n' "$OUTPUT"
            echo "WB_EOF"
          } >> "$GITHUB_OUTPUT"
          exit $CODE

      - name: Bark 通知
        if: always() && steps.gate.outputs.run == '1'
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          CHECKIN_CODE: ${{ steps.checkin.outputs.code }}
          CHECKIN_OUTPUT: ${{ steps.checkin.outputs.output }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request

          code = os.environ.get("CHECKIN_CODE", "")
          out = os.environ.get("CHECKIN_OUTPUT", "")
          bark = os.environ.get("BARK_URL", "").strip()

          detail = [l.strip() for l in out.splitlines()
                    if l.strip().startswith(("状态:", "积分:", "["))]
          body = " / ".join(detail) if detail else out.strip()
          body = body[-400:] if body else "未取到签到输出，查看 Actions 日志"

          if code == "0":
              title = "✅ WorkBuddy签到"
          elif code == "":
              title = "⚠️ WorkBuddy签到未执行"
          else:
              title = "⚠️ WorkBuddy签到异常"

          print(title, "|", body)
          if not bark:
              print("未配置 BARK_URL，跳过推送")
              raise SystemExit(0)

          url = (bark.rstrip("/") + "/" + urllib.parse.quote(title)
                 + "/" + urllib.parse.quote(body))
          try:
              req = urllib.request.Request(url, method="POST")
              with urllib.request.urlopen(req, timeout=20) as r:
                  print("Bark 推送:", r.status)
          except Exception as e:
              print("Bark 推送失败:", e)
          PY

      - name: 清理凭证
        if: always()
        run: rm -rf auths
