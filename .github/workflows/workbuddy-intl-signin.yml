name: WorkBuddy 国际版签到

on:
  schedule:
    # 全天每 30 分钟触发一次。真正执行哪一次由 checkin_gate.py 按日期抽签决定：
    # 抽中的目标时刻之后、当天 23:00 之前的任何一次运行都会执行签到。
    # 不能只在窄窗口内触发：GitHub 的 schedule 会延迟甚至丢弃（实测某天 22 次只交付 1 次），
    # 窗口外的运行被门控跳过，就会整天漏签。仓库 public 后标准 runner 不计费，触发次数不是成本。
    - cron: '0,30 * * * *'
  workflow_dispatch: # 手动触发（不抽签，直接签到）

concurrency:
  group: workbuddy-intl
  cancel-in-progress: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 纽约时间 07:00~17:00 内随机一个时刻：没抽中就在几秒内退出（不装 Python、不跑签到）
      - name: 抽签（今天这次要不要签）
        id: gate
        run: python3 checkin_gate.py

      - name: 安装 Python
        if: steps.gate.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查 Secret
        if: steps.gate.outputs.run == '1'
        env:
          TOKENS: ${{ secrets.WORKBUDDY_INTL_TOKENS }}
        run: |
          if [ -z "$TOKENS" ]; then
            echo "❌ 未配置 WORKBUDDY_INTL_TOKENS（用 intl_login.py 获取，格式：备注|AT|uid|RT）"
            exit 1
          fi
          echo "✅ 已配置国际版令牌（长度 ${#TOKENS}）"

      - name: 执行签到
        if: steps.gate.outputs.run == '1'
        env:
          WORKBUDDY_INTL_TOKENS: ${{ secrets.WORKBUDDY_INTL_TOKENS }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python intl_checkin.py

      - name: 清理
        if: always()
        run: rm -f intl_login_result.json
