name: WorkBuddy 国际版签到

on:
  schedule:
    # 每 30 分钟触发一次（UTC 11:00~22:00）。
    # 这个区间同时覆盖纽约 07:00~17:00 在夏令时（UTC-4）和冬令时（UTC-5）下的全部可能；
    # 真正执行哪一次由 intl_gate.py 按日期抽签决定，其余运行几秒内退出，几乎不耗额度。
    - cron: '0,30 11-22 * * *'
  workflow_dispatch: # 手动触发（不抽签，直接签到）

concurrency:
  group: workbuddy-intl
  cancel-in-progress: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 纽约时间 07:00~17:00 内随机一个时刻：没抽中就在几秒内退出（不装 Python、不跑签到）
      - name: 抽签（今天这次要不要签）
        id: gate
        run: python3 intl_gate.py

      - name: 安装 Python
        if: steps.gate.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查 Secret
        if: steps.gate.outputs.run == '1'
        env:
          TOKENS: ${{ secrets.WORKBUDDY_INTL_TOKENS }}
        run: |
          if [ -z "$TOKENS" ]; then
            echo "❌ 未配置 WORKBUDDY_INTL_TOKENS（用 intl_login.py 获取，格式：备注|AT|uid|RT）"
            exit 1
          fi
          echo "✅ 已配置国际版令牌（长度 ${#TOKENS}）"

      - name: 执行签到
        if: steps.gate.outputs.run == '1'
        env:
          WORKBUDDY_INTL_TOKENS: ${{ secrets.WORKBUDDY_INTL_TOKENS }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python intl_checkin.py

      - name: 清理
        if: always()
        run: rm -f intl_login_result.json
