name: TRAE 每日签到

on:
  schedule:
    # 每天 16:00 UTC 触发 = 北京时间 00:00，之后随机延时 0~4 小时再签到
    - cron: '0 16 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 编译签到工具
        run: go build -o signin_bin ./cmd/signin

      - name: 生成凭证文件
        env:
          TRAE_AUTH_1: ${{ secrets.TRAE_AUTH_1 }}
          TRAE_AUTH_2: ${{ secrets.TRAE_AUTH_2 }}
          TRAE_AUTH_3: ${{ secrets.TRAE_AUTH_3 }}
        run: |
          mkdir -p auths
          # 只写入非空的凭证，避免空 Secret 生成无效文件被计为失败
          n=0
          for v in "$TRAE_AUTH_1" "$TRAE_AUTH_2" "$TRAE_AUTH_3"; do
            if [ -n "$v" ]; then
              n=$((n+1))
              printf '%s' "$v" > "auths/trae-$n.json"
            fi
          done
          if [ "$n" -eq 0 ]; then
            echo "❌ 未配置任何 TRAE_AUTH_N secret"
            exit 1
          fi
          echo "已生成 $n 个账号凭证"

      - name: 随机延时（模拟真人，0~4 小时）
        if: github.event_name == 'schedule'
        run: |
          S=$(( (RANDOM % 14400) + 60 ))
          echo "北京时间 00:00 触发，随机等待 $S 秒（约 $((S/60)) 分钟）后签到"
          sleep $S

      - name: 执行签到
        run: |
          OUTPUT=$(./signin_bin auths 2>&1)
          echo "$OUTPUT"
          echo "SIGNIN_OUTPUT<<EOF" >> $GITHUB_ENV
          echo "$OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 提取结果
        id: result
        run: |
          echo "$SIGNIN_OUTPUT" | grep -oP '总计=\K\d+' | head -1 | xargs -I{} echo "total={}" >> $GITHUB_OUTPUT || echo "total=?" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '签到成功=\K\d+' | head -1 | xargs -I{} echo "ok={}" >> $GITHUB_OUTPUT || echo "ok=?" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '已签=\K\d+' | head -1 | xargs -I{} echo "already={}" >> $GITHUB_OUTPUT || echo "already=?" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '未确认=\K\d+' | head -1 | xargs -I{} echo "unconf={}" >> $GITHUB_OUTPUT || echo "unconf=0" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '设备异常=\K\d+' | head -1 | xargs -I{} echo "busy={}" >> $GITHUB_OUTPUT || echo "busy=0" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '失败=\K\d+' | head -1 | xargs -I{} echo "fail={}" >> $GITHUB_OUTPUT || echo "fail=?" >> $GITHUB_OUTPUT

      - name: Bark 通知
        if: always()
        run: |
          TITLE="✅ TRAE签到"
          BODY="总计${{ steps.result.outputs.total }} 成功${{ steps.result.outputs.ok }} 已签${{ steps.result.outputs.already }} 未确认${{ steps.result.outputs.unconf }} 设备异常${{ steps.result.outputs.busy }} 失败${{ steps.result.outputs.fail }}"
          if [ "${{ steps.result.outputs.busy }}" -gt 0 ] 2>/dev/null; then
            TITLE="🔑 TRAE设备号异常"
          fi
          if [ "${{ steps.result.outputs.unconf }}" -gt 0 ] 2>/dev/null; then
            TITLE="⚠️ TRAE签到未确认"
          fi
          if [ "${{ steps.result.outputs.fail }}" -gt 0 ] 2>/dev/null; then
            TITLE="⚠️ TRAE签到异常"
          fi
          # URL 编码
          TITLE_ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$TITLE'))")
          BODY_ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$BODY'))")
          curl -s -X POST "${{ secrets.BARK_URL }}/${TITLE_ENC}/${BODY_ENC}" || true

      - name: 清理凭证
        if: always()
        run: rm -rf auths
